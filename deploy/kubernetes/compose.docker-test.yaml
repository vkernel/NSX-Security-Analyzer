# Local Docker test override; do not submit this to a Kubernetes converter.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Test database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsx -d nsx"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Test secret required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Test database password required}
    depends_on:
      db:
        condition: service_healthy
  web:
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Test secret required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Test database password required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Test secret required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Test database password required}
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Test secret required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Test database password required}
    depends_on:
      migrate:
        condition: service_completed_successfully
