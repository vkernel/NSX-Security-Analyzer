# Optional one-off maintenance. Apply explicitly; keep outside Argo CD's normal sync path.
# Use the SAME image/build as the application and size memory for your snapshots.
apiVersion: batch/v1
kind: Job
metadata:
  name: nsx-refresh-snapshots
  namespace: nsx-security-analyzer
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: nsx-refresh-snapshots
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: snapshot-refresh
          image: vkernel/nsx-security-analyzer:0.5.2
          imagePullPolicy: IfNotPresent
          command: [python, manage.py, index_snapshots, --refresh]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: nsx-postgress-app, key: password}
          envFrom:
            - configMapRef: {name: nsx-config}
            - secretRef: {name: nsx-django}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            # Medium starting profile; see docs/resource-sizing.md.
            requests: {cpu: "2", memory: 8Gi}
            limits: {memory: 16Gi}
