# Converter input only. See README.md before deployment.
# Empty credential fields must become Kubernetes Secret references.
# Build/push the development image and replace its image name before deployment.
version: "3.8"
services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: nsx
      POSTGRES_USER: nsx
      POSTGRES_PASSWORD: ""
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  migrate:
    image: nsx-security-analyzer:local
    restart: on-failure
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      DJANGO_SECRET_KEY: ""
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DJANGO_HTTPS: "0"
      DJANGO_TRUST_PROXY: "0"
      POSTGRES_DB: "nsx"
      POSTGRES_USER: "nsx"
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "prefer"
      POSTGRES_CONNECT_TIMEOUT: "10"
      NSX_AUDIT_TIMEOUT: "3600"
  web:
    image: nsx-security-analyzer:local
    restart: always
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "180", "--access-logfile", "-"]
    environment:
      DJANGO_SECRET_KEY: ""
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DJANGO_HTTPS: "0"
      DJANGO_TRUST_PROXY: "0"
      POSTGRES_DB: "nsx"
      POSTGRES_USER: "nsx"
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "prefer"
      POSTGRES_CONNECT_TIMEOUT: "10"
      NSX_AUDIT_TIMEOUT: "3600"
    expose:
      - "8000"
  worker:
    image: nsx-security-analyzer:local
    restart: always
    command: ["python", "manage.py", "audit_worker"]
    environment:
      DJANGO_SECRET_KEY: ""
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DJANGO_HTTPS: "0"
      DJANGO_TRUST_PROXY: "0"
      POSTGRES_DB: "nsx"
      POSTGRES_USER: "nsx"
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "prefer"
      POSTGRES_CONNECT_TIMEOUT: "10"
      NSX_AUDIT_TIMEOUT: "3600"
  scheduler:
    image: nsx-security-analyzer:local
    restart: always
    command: ["python", "manage.py", "sync_scheduler"]
    environment:
      DJANGO_SECRET_KEY: ""
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DJANGO_HTTPS: "0"
      DJANGO_TRUST_PROXY: "0"
      POSTGRES_DB: "nsx"
      POSTGRES_USER: "nsx"
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "prefer"
      POSTGRES_CONNECT_TIMEOUT: "10"
      NSX_AUDIT_TIMEOUT: "3600"
volumes:
  postgres-data: {}
