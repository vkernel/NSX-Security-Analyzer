# Converter input only. See README.md before deployment.
# Empty credential fields must become Kubernetes Secret references.
# Pinned published image; source builds need their own registry tag.
version: "3.8"
services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: nsx
      POSTGRES_USER: nsx
      POSTGRES_PASSWORD: ""
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  migrate:
    image: vkernel/nsx-security-analyzer:0.5.2
    restart: on-failure
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      DJANGO_SECRET_KEY: ""
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DJANGO_HTTPS: "0"
      DJANGO_TRUST_PROXY: "0"
      POSTGRES_DB: "nsx"
      POSTGRES_USER: "nsx"
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "prefer"
      POSTGRES_CONNECT_TIMEOUT: "10"
      NSX_AUDIT_TIMEOUT: "3600"
  web:
    image: vkernel/nsx-security-analyzer:0.5.2
    restart: always
    environment:
      DJANGO_SECRET_KEY: ""
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DJANGO_HTTPS: "0"
      DJANGO_TRUST_PROXY: "0"
      POSTGRES_DB: "nsx"
      POSTGRES_USER: "nsx"
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "prefer"
      POSTGRES_CONNECT_TIMEOUT: "10"
      NSX_AUDIT_TIMEOUT: "3600"
    expose:
      - "8000"
  worker:
    image: vkernel/nsx-security-analyzer:0.5.2
    restart: always
    command: ["python", "manage.py", "audit_worker"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_heartbeat", "collection", "recalculation"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    environment:
      DJANGO_SECRET_KEY: ""
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DJANGO_HTTPS: "0"
      DJANGO_TRUST_PROXY: "0"
      POSTGRES_DB: "nsx"
      POSTGRES_USER: "nsx"
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "prefer"
      POSTGRES_CONNECT_TIMEOUT: "10"
      NSX_AUDIT_TIMEOUT: "3600"
  scheduler:
    image: vkernel/nsx-security-analyzer:0.5.2
    restart: always
    command: ["python", "manage.py", "sync_scheduler"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_heartbeat", "scheduler"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    environment:
      DJANGO_SECRET_KEY: ""
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DJANGO_HTTPS: "0"
      DJANGO_TRUST_PROXY: "0"
      POSTGRES_DB: "nsx"
      POSTGRES_USER: "nsx"
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "prefer"
      POSTGRES_CONNECT_TIMEOUT: "10"
      NSX_AUDIT_TIMEOUT: "3600"
volumes:
  postgres-data: {}
