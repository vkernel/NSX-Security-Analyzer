apiVersion: v1
kind: ConfigMap
metadata:
  name: nsx-config
data:
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
  DJANGO_CSRF_TRUSTED_ORIGINS: ""
  DJANGO_HTTPS: "0"
  DJANGO_TRUST_PROXY: "0"
  POSTGRES_DB: "nsx"
  POSTGRES_USER: "nsx"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: "prefer"
  POSTGRES_CONNECT_TIMEOUT: "10"
  NSX_AUDIT_TIMEOUT: "3600"
  NSX_LOG_FORMAT: "json"
  NSX_AUDIT_LOG_RETENTION_DAYS: "0"
