apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nsx-web
  template:
    metadata:
      labels:
        app: nsx-web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: web
          image: vkernel/nsx-security-analyzer:0.5.1
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: nsx-postgress-app, key: password}
          envFrom:
            - configMapRef: {name: nsx-config}
            - secretRef: {name: nsx-django}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 10
            timeoutSeconds: 5
---
