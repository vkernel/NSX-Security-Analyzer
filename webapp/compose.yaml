# Kubernetes converter input: ../deploy/kubernetes/compose.yaml (see its README).
name: nsx-security-analyzer

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nsx}
      POSTGRES_USER: ${POSTGRES_USER:-nsx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: nsx-security-analyzer:local
    build:
      context: ..
      dockerfile: webapp/Dockerfile
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-0}
      POSTGRES_DB: ${POSTGRES_DB:-nsx}
      POSTGRES_USER: ${POSTGRES_USER:-nsx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      POSTGRES_SSLROOTCERT: ${POSTGRES_SSLROOTCERT:-}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
      NSX_AUDIT_TIMEOUT: ${NSX_AUDIT_TIMEOUT:-3600}
      NSX_LOG_FORMAT: ${NSX_LOG_FORMAT:-json}
      NSX_AUDIT_LOG_RETENTION_DAYS: ${NSX_AUDIT_LOG_RETENTION_DAYS:-0}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nsx-security-analyzer:local
    build:
      context: ..
      dockerfile: webapp/Dockerfile
    init: true
    environment:
      NSX_KEYCLOAK_ENABLED: ${NSX_KEYCLOAK_ENABLED:-0}
      NSX_KEYCLOAK_ISSUER: ${NSX_KEYCLOAK_ISSUER:-}
      NSX_KEYCLOAK_CLIENT_ID: ${NSX_KEYCLOAK_CLIENT_ID:-}
      NSX_KEYCLOAK_CLIENT_SECRET: ${NSX_KEYCLOAK_CLIENT_SECRET:-}
      NSX_KEYCLOAK_CA_BUNDLE: ${NSX_KEYCLOAK_CA_BUNDLE:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-0}
      POSTGRES_DB: ${POSTGRES_DB:-nsx}
      POSTGRES_USER: ${POSTGRES_USER:-nsx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      POSTGRES_SSLROOTCERT: ${POSTGRES_SSLROOTCERT:-}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
      NSX_AUDIT_TIMEOUT: ${NSX_AUDIT_TIMEOUT:-3600}
      NSX_LOG_FORMAT: ${NSX_LOG_FORMAT:-json}
      NSX_AUDIT_LOG_RETENTION_DAYS: ${NSX_AUDIT_LOG_RETENTION_DAYS:-0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: nsx-security-analyzer:local
    build:
      context: ..
      dockerfile: webapp/Dockerfile
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-0}
      POSTGRES_DB: ${POSTGRES_DB:-nsx}
      POSTGRES_USER: ${POSTGRES_USER:-nsx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      POSTGRES_SSLROOTCERT: ${POSTGRES_SSLROOTCERT:-}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
      NSX_AUDIT_TIMEOUT: ${NSX_AUDIT_TIMEOUT:-3600}
      NSX_LOG_FORMAT: ${NSX_LOG_FORMAT:-json}
      NSX_AUDIT_LOG_RETENTION_DAYS: ${NSX_AUDIT_LOG_RETENTION_DAYS:-0}
    restart: unless-stopped
    command: ["python", "manage.py", "audit_worker"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_heartbeat", "collection", "recalculation"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    image: nsx-security-analyzer:local
    build:
      context: ..
      dockerfile: webapp/Dockerfile
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-0}
      POSTGRES_DB: ${POSTGRES_DB:-nsx}
      POSTGRES_USER: ${POSTGRES_USER:-nsx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      POSTGRES_SSLROOTCERT: ${POSTGRES_SSLROOTCERT:-}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
      NSX_AUDIT_TIMEOUT: ${NSX_AUDIT_TIMEOUT:-3600}
      NSX_LOG_FORMAT: ${NSX_LOG_FORMAT:-json}
      NSX_AUDIT_LOG_RETENTION_DAYS: ${NSX_AUDIT_LOG_RETENTION_DAYS:-0}
    restart: unless-stopped
    command: ["python", "manage.py", "sync_scheduler"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_heartbeat", "scheduler"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional one-off container; never started by a normal compose up.
  snapshot-refresh:
    image: nsx-security-analyzer:local
    build:
      context: ..
      dockerfile: webapp/Dockerfile
    profiles: [maintenance]
    mem_limit: 16g
    cpus: "2"
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-0}
      POSTGRES_DB: ${POSTGRES_DB:-nsx}
      POSTGRES_USER: ${POSTGRES_USER:-nsx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      POSTGRES_SSLROOTCERT: ${POSTGRES_SSLROOTCERT:-}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
      NSX_AUDIT_TIMEOUT: ${NSX_AUDIT_TIMEOUT:-3600}
      NSX_LOG_FORMAT: ${NSX_LOG_FORMAT:-json}
      NSX_AUDIT_LOG_RETENTION_DAYS: ${NSX_AUDIT_LOG_RETENTION_DAYS:-0}
    command: ["python", "manage.py", "index_snapshots", "--refresh"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
