<div class="pagination">{% if page.has_previous %}<a href="?{{ query_string }}&amp;page={{ page.previous_page_number }}">← Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} results</span>{% if page.has_next %}<a href="?{{ query_string }}&amp;page={{ page.next_page_number }}">Next →</a>{% endif %}</div>
