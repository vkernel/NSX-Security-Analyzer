{% if scope_options %}<div class="environment-switcher"><label class="visually-hidden" for="environment-switcher">Environment</label><select id="environment-switcher" data-scope-navigation data-browsing="{{ scope_browsing|yesno:'true,false' }}">{% for option in scope_options %}<option value="{{ option.id }}" data-url="{{ option.url }}"{% if option.recent_rank %} data-recent-rank="{{ option.recent_rank }}"{% endif %} {% if option.selected %}selected{% endif %}>{{ option.name }}</option>{% endfor %}</select><noscript><a href="{% url 'environment-directory' %}">Choose environment</a></noscript><span class="scope-status muted" role="status"></span></div>{% elif fixed_environment %}<div class="environment-fixed"><span class="muted">Environment</span><a href="{% url 'environment' fixed_environment.pk %}">{{ fixed_environment.name }}</a><small class="visually-hidden">Record context</small></div>{% endif %}
