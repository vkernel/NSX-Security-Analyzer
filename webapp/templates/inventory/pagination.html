<div class="pagination">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;view={{ view|urlencode }}&amp;status={{ selected_status|urlencode }}">Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} results</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;view={{ view|urlencode }}&amp;status={{ selected_status|urlencode }}">Next</a>{% endif %}</div>
