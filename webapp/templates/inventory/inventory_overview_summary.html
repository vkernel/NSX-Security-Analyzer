{% load workspace_time %}<template id="inventory-overview-summary"><div class="inventory-overview" data-inventory-overview>
{% if snapshot.needs_review %}<div class="overview-callout" role="status"><div><strong>Coverage needs review</strong><p>{% if overview.coverage.recorded %}{{ overview.coverage.issue_count }} coverage issue{{ overview.coverage.issue_count|pluralize }} recorded for this snapshot.{% else %}This snapshot is flagged for review.{% endif %} Objects that depend on incomplete evidence show partial or unknown results, and findings for them wait for complete coverage.</p></div><a href="#coverage">Review coverage</a></div>{% endif %}
<section class="kpi-grid inventory-counts operational-summary" aria-label="Object counts">{% for item in overview.counts %}<a class="kpi-card" href="{{ item.url }}"><span>{{ item.label }}</span><strong>{% if item.value is None %}—{% else %}{{ item.value }}{% endif %}</strong><small>{% if item.value is None %}Not recorded{% else %}{{ item.note }}{% endif %}</small></a>{% endfor %}</section>
<div class="content-split inventory-overview-split">
<section class="content-card" aria-labelledby="inventory-coverage-title"><div class="content-card-head"><h2 id="inventory-coverage-title">Evidence coverage</h2><a href="#coverage">Coverage details</a></div>
<ul class="overview-rows">{% for row in overview.coverage.rows %}<li><span>{{ row.area }}</span>{% if row.detail %}<small>{{ row.detail }}</small>{% endif %}<span class="pill {{ row.tone }}">{{ row.state }}</span></li>{% endfor %}</ul>
{% if not overview.coverage.recorded %}<p class="content-card-note">Coverage was not recorded for this snapshot. Treat its evidence as unverified.</p>{% endif %}</section>
<div data-overview-attention></div>
</div>
<section class="content-card inventory-changes" aria-labelledby="inventory-changes-title"><div class="content-card-head"><h2 id="inventory-changes-title">Changes since the previous snapshot</h2>{% if overview.changes.previous %}<a href="{{ overview.changes.url }}">Compare snapshots</a>{% endif %}</div>
<div class="content-card-body">{% if not overview.changes.previous %}<p class="muted">No earlier snapshot to compare with.</p>{% elif not overview.changes.ready %}<p class="muted">Not compared yet with the snapshot of {% user_time overview.changes.previous.generated_at %}. <a href="{{ overview.changes.url }}">Compare snapshots</a> to calculate the changes from saved evidence.</p>{% else %}<p class="muted small">Compared with {% user_time overview.changes.previous.generated_at %} · saved configuration only.</p>
<div class="change-tiles">{% for kind in overview.changes.kinds %}<div><span>{{ kind.label }}</span><p><b class="added">+{{ kind.added }}</b><b class="removed">−{{ kind.removed }}</b><span>{{ kind.changed }} changed</span></p>{% if kind.uncertain %}<small>{{ kind.uncertain }} uncertain</small>{% endif %}</div>{% endfor %}</div>{% endif %}</div></section>
</div></template>
