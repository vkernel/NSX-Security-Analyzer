{% load workspace_time %}<template id="firewall-overview-summary"><div class="inventory-overview firewall-overview" data-firewall-overview>
{% with data=firewall.data %}
{% if firewall.coverage.needs_review %}<div class="overview-callout" role="status"><div><strong>{% if data.testing %}Testing sample{% else %}Firewall evidence needs review{% endif %}</strong><p>{% if data.testing %}Only a sample of rules was collected: counts describe retrieved objects only and the segmentation indicator is withheld.{% elif data.incomplete %}Some policies or rules could not be read completely: counts describe retrieved objects only and the segmentation indicator is withheld.{% elif not firewall.coverage.recorded %}Coverage was not recorded for this snapshot. Treat its firewall evidence as unverified.{% else %}{{ firewall.coverage.issues }} recorded for firewall policies, rules or counters. Rules with unknown counters are never treated as unused.{% endif %}</p></div><a href="#coverage">Review coverage</a></div>{% endif %}
<section class="kpi-grid inventory-counts operational-summary" aria-label="Firewall counts">{% for item in firewall.cards %}<a class="kpi-card" href="{{ item.url }}"><span>{{ item.label }}</span><strong>{{ item.value }}</strong><small>{{ item.note }}</small></a>{% endfor %}</section>
<div class="content-split inventory-overview-split">
<section class="content-card segmentation-indicator" aria-labelledby="segmentation-title"><div class="content-card-head"><h2 id="segmentation-title">Segmentation indicator</h2><span class="muted small">Enabled ALLOW rules</span></div>
<div class="content-card-body"><p class="indicator-value"><strong>{{ firewall.segmentation.label }}</strong><span>{% if firewall.segmentation.state == 'assessed' %}{{ data.bounded }} of {{ data.allows }} specify both sources and destinations without ANY{% elif firewall.segmentation.state == 'na' %}No enabled ALLOW rules{% else %}Withheld while firewall evidence is incomplete{% endif %}</span></p>
{% if firewall.segmentation.state == 'assessed' %}<div class="indicator-bar" role="img" aria-label="{{ firewall.segmentation.label }} of enabled ALLOW rules have specific endpoints"><span style="width: {{ firewall.segmentation.value|stringformat:'s' }}%"></span></div>{% endif %}
{% if data.unknown_endpoints %}<p class="muted small">{{ data.unknown_endpoints }} enabled ALLOW rule{{ data.unknown_endpoints|pluralize }} with missing or invalid endpoint information stay in the denominator.</p>{% endif %}
<details class="snapshot-information"><summary>How this is calculated</summary><p>This is a rule configuration proxy, not the percentage of workloads that are microsegmented. Specific groups can still be broad or empty. Effective isolation also depends on group membership, rule order, Applied to, default rules and enforcement. No workload-level coverage is calculated.</p><p>Rules with missing or invalid endpoint information remain in the denominator. With no enabled ALLOW rules, the percentage is N/A.</p></details></div></section>
<section class="content-card overview-attention" aria-labelledby="firewall-review-title"><div class="content-card-head"><h2 id="firewall-review-title">Rules and policies to review</h2><a href="{{ firewall.rules_url }}">Open rules</a></div>
<ul class="overview-rows review-prompts">{% for item in firewall.review %}<li><a href="{{ item.url }}"><span>{{ item.label }}</span><b>{{ item.count }}</b></a></li>{% endfor %}</ul>
<p class="content-card-note">ALLOW indicators cover enabled ALLOW rules, can overlap and are review prompts, not confirmed policy errors. Service indicators use the saved services field; inline service entries are not evaluated here.</p></section>
</div>
<div class="content-split firewall-detail-split">
<section class="content-card" aria-labelledby="policy-categories-title"><div class="content-card-head"><h2 id="policy-categories-title">Policy categories</h2><a href="{% url 'snapshot' snapshot.pk %}?browse=1#dfw-policies">Open policies</a></div>
{% if data.categories %}<div class="table-scroll"><table class="category-table" data-report-enhanced="summary" data-server-footer="true"><thead><tr><th scope="col">Category</th><th scope="col">Policies</th><th scope="col">Enabled rules</th><th scope="col">Disabled rules</th></tr></thead><tbody>{% for row in data.categories %}<tr><th scope="row">{{ row.category }}</th><td>{{ row.policies }}</td><td>{{ row.enabled }}</td><td>{{ row.disabled }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<p class="content-card-note">No policies in this snapshot.</p>{% endif %}
<p class="content-card-note">{{ firewall.counter_note }}</p></section>
<section class="content-card" aria-labelledby="rule-actions-title"><div class="content-card-head"><h2 id="rule-actions-title">Enabled rule actions</h2><span class="muted small">{{ data.enabled }} enabled rule{{ data.enabled|pluralize }}</span></div>
{% if firewall.actions %}<ul class="overview-rows action-rows">{% for item in firewall.actions %}<li><span>{{ item.action }}</span><span class="action-bar" aria-hidden="true"><span style="width: {{ item.width }}%"></span></span><b>{{ item.count }}</b></li>{% endfor %}</ul>{% else %}<p class="content-card-note">No enabled rules in this snapshot.</p>{% endif %}</section>
</div>
<section class="content-card inventory-changes" aria-labelledby="firewall-changes-title"><div class="content-card-head"><h2 id="firewall-changes-title">Changes since the previous snapshot</h2>{% if firewall.changes.previous %}<a href="{{ firewall.changes.url }}">Compare snapshots</a>{% endif %}</div>
<div class="content-card-body">{% if not firewall.changes.previous %}<p class="muted">No earlier snapshot to compare with.</p>{% elif not firewall.changes.ready %}<p class="muted">Not compared yet with the snapshot of {% user_time firewall.changes.previous.generated_at %}. <a href="{{ firewall.changes.url }}">Compare snapshots</a> to calculate the changes from saved evidence.</p>{% else %}<p class="muted small">Compared with {% user_time firewall.changes.previous.generated_at %} · saved rule configuration only.</p>
<div class="change-tiles">{% for kind in firewall.changes.kinds %}<div><span>{{ kind.label }}</span><p><b class="added">+{{ kind.added }}</b><b class="removed">−{{ kind.removed }}</b><span>{{ kind.changed }} changed</span></p>{% if kind.uncertain %}<small>{{ kind.uncertain }} uncertain</small>{% endif %}</div>{% endfor %}</div>{% endif %}</div></section>
{% endwith %}
</div></template>
